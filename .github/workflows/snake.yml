name: Profile Contribution Graphics

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml
      - .github/scripts/render_contributions.py
      - .github/scripts/render_activity.py
      - assets/contributions/**

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile assets
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Generate contribution cards with current star counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/render_contributions.py --output-dir dist/contributions

      - name: Generate light and dark 3D contribution calendars
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/render_activity.py --username "${{ github.repository_owner }}" --output-dir dist/activity

      - name: Publish contribution graphics to the output branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          keep_files: true
          commit_message: Update profile contribution graphics
